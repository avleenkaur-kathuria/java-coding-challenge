# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:fxdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (optional, for debugging - DISABLED in production)
spring.h2.console.enabled=false

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Error Handling
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Management/Actuator Configuration
management.endpoints.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Logging Configuration - More detailed for debugging
logging.level.root=WARN
logging.level.com.crewmeister=INFO
logging.level.com.crewmeister.cmcodingchallenge=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN

# JSON Formatting for better readability
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Application Info
spring.application.name=crewmeister-fx-service
app.version=1.0.0-SNAPSHOT

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true
springdoc.show-actuator=true

# Base URL for fetching historical exchange rate data from Bundesbank API.
# {CURRENCY} placeholder is dynamically replaced with supported currency codes
# (e.g., USD, GBP, JPY) at runtime.
# startPeriod defines the starting date from which historical rates are retrieved.
currency.api.base-url=https://api.statistiken.bundesbank.de/rest/data/BBEX3/D.{CURRENCY}.EUR.BB.AC.000?format=json&startPeriod=2023-01-01